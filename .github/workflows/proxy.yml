name: Proxy Downloader
run-name: ${{ github.event.client_payload.request_id }}

on:
  repository_dispatch:
    types: [download]

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODE: ${{ github.event.client_payload.mode }}
      URL: ${{ github.event.client_payload.url }}
      QUALITY: ${{ github.event.client_payload.quality }}
    steps:
      - name: Prepare
        run: mkdir -p out

      - name: Setup Deno
        if: env.MODE == 'video'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup yt-dlp and PO token provider
        if: env.MODE == 'video'
        run: |
          pip install -U "yt-dlp[default]" bgutil-ytdlp-pot-provider
          docker run -d --name pot -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:4416/ping >/dev/null && break
            sleep 2
          done

      - name: Download video
        if: env.MODE == 'video'
        run: |
          set -euo pipefail
          case "$QUALITY" in
            mp3)  FMT=(-f "bestaudio/best" -x --audio-format mp3 --audio-quality 0) ;;
            1080) FMT=(-f "bv*[height<=1080]+ba/b[height<=1080]/b" --merge-output-format mp4) ;;
            720)  FMT=(-f "bv*[height<=720]+ba/b[height<=720]/b" --merge-output-format mp4) ;;
            480)  FMT=(-f "bv*[height<=480]+ba/b[height<=480]/b" --merge-output-format mp4) ;;
            *)    FMT=(-f "bv*+ba/b" --merge-output-format mp4) ;;
          esac
          yt-dlp --no-playlist --retries 5 --fragment-retries 5 \
            --print-to-file "%(title)s" out/meta.txt \
            "${FMT[@]}" -o "out/video.%(ext)s" "$URL"

      - name: Download file
        if: env.MODE == 'file'
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          curl -fL --retry 3 --retry-delay 2 -A "$UA" --output-dir out -OJ "$URL" \
            || curl -fL --retry 3 --retry-delay 2 -A "$UA" -o out/download.bin "$URL"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.request_id }}
          path: out
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
